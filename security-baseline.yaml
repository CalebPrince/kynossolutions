project:
  id: "PRJ-KYNOS-ADMIN"
  name: "KYNOS website administration"
  purpose: "Allow authorized KYNOS personnel to manage enquiries, staff access and public website content."
  owner: "KYNOS owner"
  intake:
    constraint: {statement: "Website contact details, content and enquiries cannot be safely managed by multiple accountable staff members.", evidence: "Current production admin uses one shared password and hard-coded public content."}
    forces: {push: "Content changes require code edits and deployment.", pull: "One controlled admin workspace for routine operations.", anxiety: "An unauthorized or mistaken edit could expose customer data or alter public contact details.", habit: "The owner currently relies on developer changes and a shared admin password."}
    existing_assets: ["PHP 8 application", "MySQL assessments table", "Namecheap cPanel hosting", "GitHub FTPS deployment", "server-only config.php"]
    bet: {belief: "Role-scoped administration will reduce developer dependence without exposing unrestricted control.", wager: "Add database-backed users, permissions, settings, content and audit records.", expected_outcome: "Authorized staff can manage assigned work while sensitive actions remain restricted and attributable.", leading_indicator: "Routine content and enquiry updates are completed through named accounts with audit entries."}
    outcomes: ["Every administrator uses an individual account.", "Only permitted roles can change public content or staff access.", "Customer enquiries and site settings are manageable without code changes."]
    rejected_options: [{option: "Continue one shared password", reason: "No individual accountability, revocation or least privilege."}, {option: "Give every staff member full access", reason: "Unnecessary privilege increases the impact of error or compromise."}]
  regulatory_context:
    - {regime: "Ghana Data Protection Act, 2012 (Act 843)", status: "NOT_ASSESSED", notes: "Customer contact data is processed; owner should confirm duties with qualified counsel."}
