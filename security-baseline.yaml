  - {id: "CTL-AUTHZ-001", domain: "AUTHZ", requirement: "Default-deny server authorization enforces the approved super_admin, admin and staff matrix on every mutation.", status: "PLANNED", owner: "Developer", acceptance: "Role tests deny every forbidden action, including direct POST requests.", refs: [], evidence_ids: []}
  - {id: "CTL-SESSION-001", domain: "SESSION", requirement: "Rotate sessions at login, use secure HttpOnly SameSite cookies, inactivity expiry, logout revocation and CSRF on mutations.", status: "PLANNED", owner: "Developer", acceptance: "Session and CSRF tests pass over HTTPS.", refs: [], evidence_ids: []}
  - {id: "CTL-INPUT-001", domain: "INPUT", requirement: "Allowlist settings, validate lengths/types/URLs server-side, use prepared statements and encode output.", status: "PLANNED", owner: "Developer", acceptance: "Injection and stored-XSS payloads are rejected or rendered inert.", refs: [], evidence_ids: []}
  - {id: "CTL-API-001", domain: "API", requirement: "Mutation handlers bind only explicit fields and require authentication, permission and CSRF checks.", status: "PLANNED", owner: "Developer", acceptance: "Mass-assignment and replay attempts do not change unauthorized fields.", refs: [], evidence_ids: []}
  - {id: "CTL-FRONT-001", domain: "FRONTEND", requirement: "No secrets in client code; safe output encoding and security headers protect admin and public pages.", status: "PLANNED", owner: "Developer", acceptance: "Manual inspection and response-header checks show the approved controls.", refs: [], evidence_ids: []}
  - {id: "CTL-CRYPTO-001", domain: "CRYPTO", requirement: "Use PHP password_hash/password_verify, random_bytes tokens and HTTPS transport.", status: "PLANNED", owner: "Developer", acceptance: "Stored credentials are one-way hashes and production is HTTPS-only.", refs: [], evidence_ids: []}
  - {id: "CTL-SECRET-001", domain: "SECRETS", requirement: "Database and bootstrap secrets remain in server-only config.php or GitHub environment secrets and never logs or source.", status: "IMPLEMENTED", owner: "KYNOS owner", acceptance: "Repository and release inspection contain no production secrets.", refs: [], evidence_ids: []}
  - {id: "CTL-CONFIG-001", domain: "CONFIG", requirement: "Production disables verbose errors, blocks private files and fails closed when configuration is incomplete.", status: "PLANNED", owner: "Developer", acceptance: "Direct requests for private files are denied and missing config exposes no secret detail.", refs: [], evidence_ids: []}
  - {id: "CTL-DATA-001", domain: "DATA", requirement: "Collect only operational customer fields; restrict access by role; document retention and deletion.", status: "PLANNED", owner: "KYNOS owner", acceptance: "Data inventory, access tests and owner-approved retention are recorded.", refs: [], evidence_ids: []}
  - {id: "CTL-ERR-001", domain: "ERROR_HANDLING", requirement: "Authorization, database and validation failures fail closed with non-sensitive messages.", status: "PLANNED", owner: "Developer", acceptance: "Failure tests expose no stack traces, SQL or credentials.", refs: [], evidence_ids: []}
  - {id: "CTL-LOG-001", domain: "LOGGING", requirement: "Audit authentication, user, role, customer, content and settings changes without passwords or session tokens.", status: "PLANNED", owner: "Developer", acceptance: "Each sensitive action creates an attributable audit record.", refs: [], evidence_ids: []}
  - {id: "CTL-SC-001", domain: "SUPPLY_CHAIN", requirement: "Pin third-party CI actions and review externally loaded admin dependencies.", status: "PLANNED", owner: "Developer", acceptance: "Workflow actions are commit-pinned and dependency review is recorded.", refs: [], evidence_ids: []}
  - {id: "CTL-DEPLOY-001", domain: "DEPLOY", requirement: "Deploy only from main through scoped FTPS secrets; exclude config.php and verify protected routes.", status: "IMPLEMENTED", owner: "Developer", acceptance: "Deployment checks confirm live routes and private configuration exclusion.", refs: [], evidence_ids: []}
  - {id: "CTL-GOV-001", domain: "GOVERNANCE", requirement: "Material authentication, authorization or data-boundary changes require owner approval of a revised baseline.", status: "IMPLEMENTED", owner: "KYNOS owner", acceptance: "Approval is recorded with version and scope before implementation.", refs: [], evidence_ids: ["EVD-001"]}
